<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — ORVO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<div id="orvo-splash">
  <div class="orvo-logo-text">ORVO</div>
  <div class="orvo-splash-sub">AI Trading Platform</div>
</div>

<div class="flex min-h-screen">
  <aside id="orvo-shell-sidebar" class="w-64 flex-shrink-0 border-r hidden md:flex md:flex-col" style="border-color:var(--border-color)"></aside>

  <div class="flex-1 min-w-0">
    <header id="orvo-shell-topbar" class="px-6 py-4 border-b" style="border-color:var(--border-color)"></header>

    <main class="p-6 space-y-6 max-w-2xl">
      <h1 class="text-2xl font-bold">Profile</h1>

      <div class="card p-6">
        <h2 class="font-semibold mb-4">Account Details</h2>
        <form id="profile-form" class="space-y-4">
          <div>
            <label class="text-xs font-medium block mb-1">Full Name</label>
            <input type="text" id="full_name" required class="input-field">
          </div>
          <div>
            <label class="text-xs font-medium block mb-1">Email</label>
            <input type="email" id="email" disabled class="input-field opacity-60">
          </div>
          <div>
            <label class="text-xs font-medium block mb-1">Role</label>
            <input type="text" id="role" disabled class="input-field opacity-60">
          </div>
          <div>
            <label class="text-xs font-medium block mb-1">Member Since</label>
            <input type="text" id="created_at" disabled class="input-field opacity-60">
          </div>
          <button type="submit" class="btn-primary">Save Changes</button>
        </form>
      </div>

      <div class="card p-6">
        <h2 class="font-semibold mb-4">Change Password</h2>
        <form id="password-form" class="space-y-4">
          <div>
            <label class="text-xs font-medium block mb-1">Current Password</label>
            <input type="password" id="current_password" required class="input-field">
          </div>
          <div>
            <label class="text-xs font-medium block mb-1">New Password</label>
            <input type="password" id="new_password" required minlength="8" class="input-field">
          </div>
          <button type="submit" class="btn-primary">Change Password</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/app-shell.js"></script>
<script>
(async () => {
  const user = await orvoInitAppShell();
  if (!user) return;

  document.getElementById("full_name").value = user.full_name;
  document.getElementById("email").value = user.email;
  document.getElementById("role").value = user.role;
  document.getElementById("created_at").value = new Date(user.created_at).toLocaleDateString();

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await ORVO_API.put("/api/users/profile", { full_name: document.getElementById("full_name").value.trim() });
      orvoShowToast("Profile updated.", "success");
    } catch (err) {
      orvoShowToast(err.message, "error");
    }
  });

  document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const res = await ORVO_API.post("/api/auth/change-password", {
        current_password: document.getElementById("current_password").value,
        new_password: document.getElementById("new_password").value,
      });
      orvoShowToast(res.message, "success");
      document.getElementById("password-form").reset();
    } catch (err) {
      orvoShowToast(err.message, "error");
    }
  });
})();
</script>
<script src="/assets/js/splash.js"></script>
</body>
</html>
