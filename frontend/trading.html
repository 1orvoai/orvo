<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading — ORVO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<div id="orvo-splash">
  <div class="orvo-logo-text">ORVO</div>
  <div class="orvo-splash-sub">AI Trading Platform</div>
</div>

<div class="flex min-h-screen">
  <aside id="orvo-shell-sidebar" class="w-64 flex-shrink-0 border-r hidden md:flex md:flex-col" style="border-color:var(--border-color)"></aside>

  <div class="flex-1 min-w-0">
    <header id="orvo-shell-topbar" class="px-6 py-4 border-b" style="border-color:var(--border-color)"></header>

    <main class="p-6 space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <h1 class="text-2xl font-bold">Trading</h1>
        <div class="flex items-center gap-3">
          <select id="symbol-select" class="input-field w-40"></select>
          <select id="timeframe-select" class="input-field w-32">
            <option value="15m">15m</option>
            <option value="1h" selected>1h</option>
            <option value="4h">4h</option>
            <option value="1d">1D</option>
          </select>
          <select id="broker-connection-select" class="input-field w-56"></select>
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <!-- Chart -->
        <div class="card p-2 xl:col-span-2" style="min-height:520px">
          <div id="tv_chart_container" style="height:500px"></div>
        </div>

        <!-- AI + Order panel -->
        <div class="space-y-6">
          <div class="card p-5">
            <div class="flex items-center justify-between mb-3">
              <h2 class="font-semibold">AI Analysis</h2>
              <button id="refresh-ai-btn" class="text-sm" style="color:var(--accent)">Refresh</button>
            </div>
            <div id="ai-panel">
              <div class="skeleton h-24"></div>
            </div>
          </div>

          <div class="card p-5">
            <h2 class="font-semibold mb-3">Order Ticket</h2>
            <form id="order-form" class="space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <button type="button" id="buy-btn" class="btn-buy py-3">BUY</button>
                <button type="button" id="sell-btn" class="btn-sell py-3">SELL</button>
              </div>
              <div>
                <label class="text-xs font-medium block mb-1">Lot Size</label>
                <input type="number" step="0.01" min="0.01" id="lot-size" class="input-field" placeholder="e.g. 0.10">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs font-medium block mb-1">Stop Loss</label>
                  <input type="number" step="any" id="order-sl" class="input-field">
                </div>
                <div>
                  <label class="text-xs font-medium block mb-1">Take Profit</label>
                  <input type="number" step="any" id="order-tp" class="input-field">
                </div>
              </div>
              <label class="flex items-center gap-2 text-sm" style="color:var(--text-secondary)">
                <input type="checkbox" id="one-click-toggle"> One-click trading (skip confirmation)
              </label>
              <input type="hidden" id="pending-side">
            </form>
          </div>
        </div>
      </div>

      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold">Open Positions</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left" style="color:var(--text-secondary)">
                <th class="pb-2">Symbol</th><th class="pb-2">Side</th><th class="pb-2">Lot</th>
                <th class="pb-2">Entry</th><th class="pb-2">SL</th><th class="pb-2">TP</th>
                <th class="pb-2">Opened</th><th class="pb-2"></th>
              </tr>
            </thead>
            <tbody id="open-positions-body"></tbody>
          </table>
          <div id="open-positions-empty" class="text-center py-8 hidden" style="color:var(--text-muted)">No open positions.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/app-shell.js"></script>
<script src="/assets/js/charts.js"></script>
<script src="/assets/js/trading.js"></script>
<script src="/assets/js/splash.js"></script>
</body>
</html>
