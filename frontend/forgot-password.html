<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — ORVO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<div id="orvo-splash">
  <div class="orvo-logo-text">ORVO</div>
  <div class="orvo-splash-sub">AI Trading Platform</div>
</div>

<nav class="flex items-center justify-between px-8 py-5">
  <a href="/index.html" class="text-2xl font-extrabold tracking-widest" style="color:var(--accent)">ORVO</a>
  <button onclick="ORVO_THEME.toggle()" class="btn-secondary" data-theme-icon>🌙</button>
</nav>

<main class="max-w-md mx-auto px-6 py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold mb-1">Reset your password</h1>
    <p class="text-sm mb-6" style="color:var(--text-secondary)">
      Enter your email and we'll send you a reset link (requires SMTP to be configured — see console output if not).
    </p>

    <form id="forgot-form" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" id="email" required class="input-field" placeholder="you@example.com">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary w-full py-3">Send Reset Link</button>
    </form>

    <div id="success-box" class="hidden mt-6 p-4 rounded-lg text-sm" style="background:var(--accent-soft);color:var(--accent)"></div>

    <p class="text-sm text-center mt-6" style="color:var(--text-secondary)">
      <a href="/login.html" style="color:var(--accent)" class="font-semibold">Back to login</a>
    </p>
  </div>
</main>

<script src="/assets/js/api.js"></script>
<script>
document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    const res = await ORVO_API.post("/api/auth/forgot-password", {
      email: document.getElementById("email").value.trim(),
    });
    document.getElementById("success-box").textContent = res.message;
    document.getElementById("success-box").classList.remove("hidden");
  } catch (err) {
    orvoShowToast(err.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Send Reset Link";
  }
});
</script>
<script src="/assets/js/splash.js"></script>
</body>
</html>
