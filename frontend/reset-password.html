<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ORVO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<div id="orvo-splash">
  <div class="orvo-logo-text">ORVO</div>
  <div class="orvo-splash-sub">AI Trading Platform</div>
</div>

<nav class="flex items-center justify-between px-8 py-5">
  <a href="/index.html" class="text-2xl font-extrabold tracking-widest" style="color:var(--accent)">ORVO</a>
  <button onclick="ORVO_THEME.toggle()" class="btn-secondary" data-theme-icon>🌙</button>
</nav>

<main class="max-w-md mx-auto px-6 py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold mb-1">Set a new password</h1>
    <p class="text-sm mb-6" style="color:var(--text-secondary)">Enter and confirm your new password below.</p>

    <form id="reset-form" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">New password</label>
        <input type="password" id="new_password" required minlength="8" class="input-field" placeholder="Min 8 characters, 1 uppercase, 1 number">
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Confirm new password</label>
        <input type="password" id="confirm_password" required minlength="8" class="input-field">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary w-full py-3">Reset Password</button>
    </form>
  </div>
</main>

<script src="/assets/js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
if (!token) {
  orvoShowToast("Missing or invalid reset link.", "error");
}

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p1 = document.getElementById("new_password").value;
  const p2 = document.getElementById("confirm_password").value;
  if (p1 !== p2) {
    orvoShowToast("Passwords do not match.", "error");
    return;
  }
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Resetting...";
  try {
    const res = await ORVO_API.post("/api/auth/reset-password", { token, new_password: p1 });
    orvoShowToast(res.message, "success");
    setTimeout(() => (window.location.href = "/login.html"), 1500);
  } catch (err) {
    orvoShowToast(err.message, "error");
    btn.disabled = false;
    btn.textContent = "Reset Password";
  }
});
</script>
<script src="/assets/js/splash.js"></script>
</body>
</html>
