<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ORVO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>

<div id="orvo-splash">
  <div class="orvo-logo-text">ORVO</div>
  <div class="orvo-splash-sub">AI Trading Platform</div>
</div>

<nav class="flex items-center justify-between px-8 py-5">
  <a href="/index.html" class="text-2xl font-extrabold tracking-widest" style="color:var(--accent)">ORVO</a>
  <button onclick="ORVO_THEME.toggle()" class="btn-secondary" data-theme-icon>🌙</button>
</nav>

<main class="max-w-md mx-auto px-6 py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold mb-1">Welcome back</h1>
    <p class="text-sm mb-6" style="color:var(--text-secondary)">Log in to your ORVO account</p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" id="email" required class="input-field" placeholder="you@example.com">
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input type="password" id="password" required class="input-field" placeholder="••••••••">
      </div>
      <div class="flex justify-end">
        <a href="/forgot-password.html" class="text-sm" style="color:var(--accent)">Forgot password?</a>
      </div>
      <button type="submit" id="submit-btn" class="btn-primary w-full py-3">Log In</button>
    </form>

    <p class="text-sm text-center mt-6" style="color:var(--text-secondary)">
      Don't have an account? <a href="/signup.html" style="color:var(--accent)" class="font-semibold">Sign up</a>
    </p>
  </div>
</main>

<script src="/assets/js/api.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Logging in...";
  try {
    const data = await ORVO_API.post("/api/auth/login", {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    });
    ORVO_API.setToken(data.access_token);
    window.location.href = "/dashboard.html";
  } catch (err) {
    orvoShowToast(err.message, "error");
    btn.disabled = false;
    btn.textContent = "Log In";
  }
});
</script>
<script src="/assets/js/splash.js"></script>
</body>
</html>
